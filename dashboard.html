<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rewardo Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6fb;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 350px;
      margin: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 15px;
      margin: 8px;
      border: none;
      border-radius: 6px;
      background: #4CAF50;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button.logout {
      background: #f44336;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>🎉 Welcome to Rewardo</h2>

    <p><b>Email:</b> <span id="userEmail">Loading...</span></p>
    <p><b>Coins:</b> <span id="coins">0</span> 🪙</p>

    <button onclick="addCoin()">➕ Add Coin (Test)</button>
    <button class="logout" onclick="logout()">🚪 Logout</button>
  </div>

  <!-- SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      updateDoc,
      increment
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAMXBGszT_7WaIfAy3SMcCfYG0ZKoY-_bA",
      authDomain: "rewardo-app-dacbb.firebaseapp.com",
      projectId: "rewardo-app-dacbb",
      appId: "1:936435804158:web:1c48b5b2edad86f73102af"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let userRef;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      document.getElementById("userEmail").innerText = user.email;
      userRef = doc(db, "users", user.uid);

      const snap = await getDoc(userRef);
      if (!snap.exists()) {
        await setDoc(userRef, {
          email: user.email,
          coins: 0,
          role: "user"
        });
      }

      const data = (await getDoc(userRef)).data();
      document.getElementById("coins").innerText = data.coins;
    });

    window.addCoin = async () => {
      if (!userRef) return;
      await updateDoc(userRef, { coins: increment(1) });
      const snap = await getDoc(userRef);
      document.getElementById("coins").innerText = snap.data().coins;
    };

    window.logout = () => {
      signOut(auth).then(() => {
        window.location.href = "index.html";
      });
    };
  </script>
</body>
</html>
