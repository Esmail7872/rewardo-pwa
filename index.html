<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rewardo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input { padding: 8px; margin: 5px; width: 260px; }
    button { padding: 8px 14px; margin: 5px; }
    #msg { margin-top: 10px; }
  </style>
</head>
<body>

  <h2>🎁 Rewardo Login</h2>

  <input id="email" type="email" placeholder="Email" /><br>
  <input id="password" type="password" placeholder="Password (6+)" /><br><br>

  <button id="signupBtn">Sign Up</button>
  <button id="loginBtn">Login</button>

  <div id="msg"></div>

  <!-- ✅ SINGLE MODULE SCRIPT (NO OTHER JS FILES NEEDED FOR AUTH) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";

    // 🔥 Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyAMXBGszT_7WaIfAy3SMcCfYG0ZKoY-_bA",
      authDomain: "rewardo-app-dacbb.firebaseapp.com",
      projectId: "rewardo-app-dacbb",
      storageBucket: "rewardo-app-dacbb.firebasestorage.app",
      messagingSenderId: "936435804158",
      appId: "1:936435804158:web:1c48b5b2edad86f73102af"
    };

    // Init
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailEl = document.getElementById("email");
    const passEl = document.getElementById("password");
    const msg = document.getElementById("msg");

    // 👉 SIGN UP
    document.getElementById("signupBtn").onclick = async () => {
      msg.innerText = "Processing signup...";
      try {
        await createUserWithEmailAndPassword(auth, emailEl.value, passEl.value);
        msg.innerText = "✅ Signup successful";
        msg.style.color = "green";
      } catch (e) {
        msg.innerText = e.message;
        msg.style.color = "red";
      }
    };

    // 👉 LOGIN
    document.getElementById("loginBtn").onclick = async () => {
      msg.innerText = "Processing login...";
      try {
        await signInWithEmailAndPassword(auth, emailEl.value, passEl.value);
        msg.innerText = "✅ Login successful";
        msg.style.color = "green";
      } catch (e) {
        msg.innerText = e.message;
        msg.style.color = "red";
      }
    };
  </script>

</body>
</html>
